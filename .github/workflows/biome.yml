name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
        # 不传 version：action 会从 lockfile 提取 @biomejs/biome 版本，
        # 始终与本地开发一致（dependabot 升级后自动跟随，无需改这里）
        with:
          version: ""
      - name: Run Biome
        run: biome ci ./src --reporter=github
