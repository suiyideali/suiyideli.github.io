name: Code quality

on:
  push:
    branches: [ main ] # Adjust branches as needed
  pull_request:
    branches: [ main ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        # 不传 version：action 会从 lockfile 提取 @biomejs/biome 版本，
        # 始终与本地开发一致（dependabot 升级后自动跟随，无需改这里）
        with:
          version: ""
      - name: Run Biome
        run: biome ci ./src --reporter=github
